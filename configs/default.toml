# SyntheticReefDomain.jl -- default configuration (every option, with its default value).
#
#   using SyntheticReefDomain
#   generate_domain("configs/default.toml")            # -> domains/SyntheticReefs
#   dom = ADRIA.load_domain("domains/SyntheticReefs", 45)
#
# Per-reef attributes accept four forms:
#   x = 0.3                       every reef gets 0.3
#   x = [0.1, 0.2, 0.3]           one value per reef (length must equal reefs.n)
#   x = {min = 0.1, max = 0.5}    drawn uniformly per reef (seeded)
#   x = {from = 0.1, to = 0.5}    linear gradient from the first to the last reef
# Reef order follows the layout (e.g. west -> east for a line with bearing 90).

[domain]
name = "SyntheticReefs"        # folder / geopackage name; letters, digits, _ - .
timeframe = [2025, 2099]       # first and last simulated year (at least 26 years)
seed = 1234                    # every random draw derives from this
n_dhw_scenarios = 50           # DHW (and wave) scenarios per climate level
n_cyclone_scenarios = 50

[reefs]
n = 10                         # 1-20 reefs; each reef is one ADRIA location
layout = "line"                # line | grid | ring | random | clustered
center = [146.0, -18.0]        # [lon, lat] of the system centre (EPSG:4326)
spacing_km = 5.0               # distance between neighbouring reefs
bearing_deg = 90.0             # main axis, clockwise from north (90 = west -> east)
n_clusters = 1                 # cluster_id groups (contiguous blocks of reefs)
cluster_spacing_km = 20.0      # distance between cluster centres (layout = "clustered")
area_m2 = {min = 60000.0, max = 93000.0}   # reef area (Moore interquartile range)
k_percent = {min = 45.0, max = 63.0}       # habitable fraction of the area, in %
depth_med = {min = 2.0, max = 15.0}        # median depth, m
ub_med = {min = 0.23, max = 0.55}          # median wave orbital velocity, m/s (read by C~scape)
habitat = "Slope"              # or one per reef, e.g. ["Crest", "Slope", ...] (informational)
cb_calib_group = 1             # CoralBlox calibration group 1-12 (or one per reef)
distinct_ub_depth = true       # nudge identical (ub_med, depth_med) pairs apart (C~scape)
waves_from_ub_med = true       # wave Ub file = ub_med per reef; false = zeros

[connectivity]
# Source (row) -> sink (column) transfer probabilities.
topology = "distance_decay"    # isolated | chain | ring | all_to_all | distance_decay | random
self_recruitment = 0.2         # diagonal: fraction of larvae settling on the home reef
strength = 0.05                # largest off-diagonal value
asymmetry = 0.0                # chain/ring: 0 = symmetric, 1 = only reef i -> i+1
reach = 1                      # chain/ring: downstream neighbours linked (weights halve per step)
decay_km = 10.0                # distance_decay: exp(-distance / decay_km)
density = 0.3                  # random: probability that a directed link exists

[cover]
total_percent = {min = 10.0, max = 40.0}  # total initial cover per reef, in %
basis = "habitable"            # habitable = % of habitable area (ADRIA's unit) | reef = % of reef area
# Relative share of: tabular Acropora, corymbose Acropora, corymbose non-Acropora,
# Small massives, Large massives (default: group means of ADRIA's Test_domain)
composition = [0.26, 0.25, 0.07, 0.19, 0.23]
jitter = 0.0                   # per-reef variation of the mix: 0 none, 0.05 subtle, 0.5 strong

[dhw]
# Regional signal R = baseline + trend + AR(1) anomaly + heatwave events (per scenario);
# reef DHW = max(0, reef_exposure * R + reef_offset + local_sd * noise).
baseline = 3.5                 # DHW in the first year, before noise and events
trend_per_decade = 1.2         # warming trend (DHW per decade)
interannual_sd = 2.0           # SD of the regional anomaly
ar1 = 0.3                      # year-to-year autocorrelation of the anomaly
event_prob = 0.15              # chance of a marine heatwave in any year
event_magnitude = [2.0, 6.0]   # extra DHW in a heatwave year, [min, max]
event_years = []               # heatwave years forced in every scenario, e.g. [2030, 2045]
reef_exposure = {min = 0.7, max = 1.3}  # multiplier per reef; {from = 0.6, to = 1.4} = refuge -> hotspot
reef_offset = 0.0              # additive DHW per reef
local_sd = 2.0                 # reef-level noise; 0 (with exposure 1) = identical DHW everywhere

# One table per climate level; each writes DHWs/dhwRCP<label>.nc. The label is any positive
# integer (ADRIA treats it as a number, so it need not be a real RCP) and can override any of
# baseline, trend_per_decade, interannual_sd, ar1, event_prob, event_magnitude, event_years,
# local_sd. Keep 45 to stay compatible with scripts that load ADRIA domains with RCP 45.
[dhw.climate.45]

[cyclones]
# System-wide: in a cyclone year every reef loses the same fraction of each group.
enabled = true
annual_prob = 0.1              # chance of a cyclone in any year
event_years = []               # cyclone years forced in every scenario
intensity = [0.2, 1.0]         # per-event intensity (0-1), [min, max]
# Mortality at intensity 1 for each group (same order as cover.composition)
group_vulnerability = [0.6, 0.5, 0.4, 0.2, 0.1]
